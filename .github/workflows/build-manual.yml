name: Build Kernel (Manual)

on:
  workflow_dispatch:
    inputs:
      enable_ccache:
        description: 'Enable ccache (accelerate recompilation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      release_kernel:
        description: 'Publish kernel to GitHub Releases'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel (LLVM 22.0 Full Toolchain)
    runs-on: ubuntu-22.04
    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      TOOLCHAIN: ${{ github.workspace }}/toolchain/clang
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      # ─────────────────────────────────────────────
      # 1. 检出仓库
      # ─────────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: kmerc224/android_kernel_xiaomi_sm8150
          ref: 16-Hyper
          path: kernel

      # ─────────────────────────────────────────────
      # 2. 安装依赖
      # ─────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio \
            flex git-core libssl-dev libelf-dev \
            python3 rsync unzip wget zip p7zip-full

      # ─────────────────────────────────────────────
      # 3. 下载 LLVM 22.0 完整工具链 (含 GCC 交叉编译器)
      #    来源: Mandi-Sa/clang (Full LTO + PGO + BOLT)
      # ─────────────────────────────────────────────
      - name: Download LLVM 22.0 full toolchain
        run: |
          mkdir -p toolchain

          TOOLCHAIN_URL="https://github.com/Mandi-Sa/clang/releases/download/amd64-full-toolchain-22/llvm22.0.0-binutils2.45.1_amd64-full-toolchain-20260101.7z"
          echo "::group::Downloading LLVM 22.0 full toolchain..."
          echo "URL: ${TOOLCHAIN_URL}"
          wget --no-verbose "${TOOLCHAIN_URL}" -O toolchain/toolchain.7z
          echo "::endgroup::"

          echo "::group::Extracting toolchain..."
          7z x toolchain/toolchain.7z -otoolchain/ -y

          # 检测解压后的顶层目录
          TOP_DIR=$(ls -d toolchain/*/ 2>/dev/null | head -1 | sed 's|/$||')
          if [ -z "${TOP_DIR}" ]; then
            echo "ERROR: Extraction failed, no directory found"
            exit 1
          fi
          echo "Extracted to: ${TOP_DIR}"

          # 移动到目标路径
          mv "${TOP_DIR}" toolchain/clang
          rm -f toolchain/toolchain.7z
          echo "::endgroup::"

          # 显示目录结构
          echo "=== Toolchain structure ==="
          ls toolchain/clang/
          echo "=== bin/ contents (compilers) ==="
          ls toolchain/clang/bin/ | grep -E '^(clang|ld|llvm-ar|aarch64|arm)' | head -20

          # 验证 Clang
          toolchain/clang/bin/clang --version

      # ─────────────────────────────────────────────
      # 4. 配置 ccache (可选)
      # ─────────────────────────────────────────────
      - name: Setup ccache
        if: github.event.inputs.enable_ccache == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: kernel-sm8150-clang22

      # ─────────────────────────────────────────────
      # 5. 设置环境变量
      # ─────────────────────────────────────────────
      - name: Setup environment
        run: |
          TOOLCHAIN_BIN="${TOOLCHAIN}/bin"
          export PATH="${TOOLCHAIN_BIN}:${PATH}"

          echo "PATH=${PATH}" >> $GITHUB_ENV
          echo "TOOLCHAIN_BIN=${TOOLCHAIN_BIN}" >> $GITHUB_ENV

          # 打印编译器版本
          echo "=== Clang Version ==="
          clang --version

          echo "=== ld.lld Version ==="
          ld.lld --version

          echo "=== llvm-ar Version ==="
          llvm-ar --version

          # 检测 GCC 交叉编译器
          echo "=== GCC cross-compilers ==="
          ls "${TOOLCHAIN_BIN}/" | grep -E '(aarch64|arm).*gcc' || echo "(checking subdirectories...)"

          # Mandi-Sa 工具链可能将 GCC 放在子目录
          if [ -d "${TOOLCHAIN}/aarch64-linux-gnu/bin" ]; then
            echo "--- aarch64-linux-gnu GCC ---"
            ls "${TOOLCHAIN}/aarch64-linux-gnu/bin/" | grep gcc || true
            "${TOOLCHAIN}/aarch64-linux-gnu/bin/aarch64-linux-gnu-gcc" --version 2>/dev/null || true
          fi

          if [ -d "${TOOLCHAIN}/arm-linux-gnueabi/bin" ]; then
            echo "--- arm-linux-gnueabi GCC ---"
            ls "${TOOLCHAIN}/arm-linux-gnueabi/bin/" | grep gcc || true
            "${TOOLCHAIN}/arm-linux-gnueabi/bin/arm-linux-gnueabi-gcc" --version 2>/dev/null || true
          fi

      # ─────────────────────────────────────────────
      # 6. 编译内核
      # ─────────────────────────────────────────────
      - name: Build kernel
        run: |
          cd "${KERNEL_DIR}"
          mkdir -p "${OUT_DIR}"

          # ── 基础 defconfig ──
          make O="${OUT_DIR}" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            vendor/sm8150-perf_defconfig

          # ── 叠加小米设备配置片段 (如果有) ──
          if [ -f "arch/arm64/configs/vendor/xiaomi/sm8150-common.config" ]; then
            echo "Applying xiaomi sm8150-common.config fragment..."
            scripts/kconfig/merge_config.sh -O "${OUT_DIR}" -m \
              "${OUT_DIR}/.config" \
              arch/arm64/configs/vendor/xiaomi/sm8150-common.config || true
          fi

          if [ -f "arch/arm64/configs/vendor/xiaomi/raphael.config" ]; then
            echo "Applying xiaomi raphael.config fragment..."
            scripts/kconfig/merge_config.sh -O "${OUT_DIR}" -m \
              "${OUT_DIR}/.config" \
              arch/arm64/configs/vendor/xiaomi/raphael.config || true
          fi

          # ── 检测 GCC 交叉编译器前缀 ──
          # Mandi-Sa 工具链使用 aarch64-linux-gnu- / arm-linux-gnueabi- 前缀
          GCC64_PREFIX=""
          if [ -x "${TOOLCHAIN}/aarch64-linux-gnu/bin/aarch64-linux-gnu-gcc" ]; then
            GCC64_PREFIX="aarch64-linux-gnu-"
          elif [ -x "${TOOLCHAIN_BIN}/aarch64-linux-gnu-gcc" ]; then
            GCC64_PREFIX="aarch64-linux-gnu-"
          fi

          GCC32_PREFIX=""
          if [ -x "${TOOLCHAIN}/arm-linux-gnueabi/bin/arm-linux-gnueabi-gcc" ]; then
            GCC32_PREFIX="arm-linux-gnueabi-"
          elif [ -x "${TOOLCHAIN_BIN}/arm-linux-gnueabi-gcc" ]; then
            GCC32_PREFIX="arm-linux-gnueabi-"
          fi

          echo "Detected GCC64 prefix: ${GCC64_PREFIX:-'(none, Clang only)'}"
          echo "Detected GCC32 prefix: ${GCC32_PREFIX:-'(none)'}"

          # ── 设置 GCC 路径 ──
          GCC64_PATH=""
          if [ -d "${TOOLCHAIN}/aarch64-linux-gnu/bin" ]; then
            GCC64_PATH="${TOOLCHAIN}/aarch64-linux-gnu/bin"
          fi
          GCC32_PATH=""
          if [ -d "${TOOLCHAIN}/arm-linux-gnueabi/bin" ]; then
            GCC32_PATH="${TOOLCHAIN}/arm-linux-gnueabi/bin"
          fi

          # ── 开始编译 ──
          CCACHE=""
          if [ "${{ github.event.inputs.enable_ccache }}" = "true" ]; then
            CCACHE="ccache"
          fi

          # 如果有 GCC 子目录, 临时加入 PATH
          if [ -n "${GCC64_PATH}" ]; then
            export PATH="${GCC64_PATH}:${PATH}"
          fi
          if [ -n "${GCC32_PATH}" ]; then
            export PATH="${GCC32_PATH}:${PATH}"
          fi

          make -j$(nproc --all) O="${OUT_DIR}" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="${CCACHE} clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${GCC64_PREFIX}" \
            CROSS_COMPILE_ARM32="${GCC32_PREFIX}" \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            LDFLAGS="--lto-O0" \
            HOSTCC=clang \
            HOSTCXX=clang \
            HOSTAR=llvm-ar \
            HOSTLD=ld.lld \
            Image.gz 2>&1 | tee build.log

          echo "Build exit code: ${PIPESTATUS[0]}"

      # ─────────────────────────────────────────────
      # 7. 检查产物
      # ─────────────────────────────────────────────
      - name: Check build output
        run: |
          echo "=== Build artifacts ==="
          ls -lah "${OUT_DIR}/arch/arm64/boot/" || true
          ls -lah "${OUT_DIR}/arch/arm64/boot/Image.gz" 2>/dev/null || {
            echo "ERROR: Image.gz not found!"
            exit 1
          }
          echo "=== Kernel size ==="
          du -h "${OUT_DIR}/arch/arm64/boot/Image.gz"

      # ─────────────────────────────────────────────
      # 8. AnyKernel3 打包
      # ─────────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          echo "::group::Cloning AnyKernel3..."
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3
          echo "::endgroup::"

          # 配置 AnyKernel3 (raphael = K20 Pro / Mi 9T Pro)
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' anykernel.sh

          # 复制内核镜像
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz" .

          # 复制 DTBO (如果存在)
          if [ -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/dtbo.img" .
          fi

          # 打包
          ZIP_NAME="AnyKernel3-raphael-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "${ZIP_NAME}" . -x .git\* .github\* \*.zip
          mv "${ZIP_NAME}" "${GITHUB_WORKSPACE}/"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 9. 上传产物
      # ─────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz
            ${{ env.ZIP_NAME }}
            ${{ env.KERNEL_DIR }}/build.log

      # ─────────────────────────────────────────────
      # 10. 发布到 GitHub Releases (可选)
      # ─────────────────────────────────────────────
      - name: Release kernel
        if: github.event.inputs.release_kernel == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-16-Hyper-${{ github.run_number }}
          name: "Kernel 16-Hyper (LLVM 22.0) #${{ github.run_number }}"
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz
          body: |
            ## Kernel Build Info
            - **Branch**: 16-Hyper
            - **Device**: Xiaomi K20 Pro (raphael)
            - **Compiler**: LLVM 22.0.0 Full Toolchain (Mandi-Sa, PGO+BOLT)
            - **Binutils**: 2.45.1
            - **Defconfig**: vendor/sm8150-perf_defconfig + xiaomi fragments
            - **Build**: ${{ github.run_number }}
            - **Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
